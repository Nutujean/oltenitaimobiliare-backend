name: Check published external-offers service
on:
  pull_request:
    paths:
      - '.github/workflows/live-external-offers.yml'
  schedule:
    - cron: '40 8 * * *'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe production read-only routes
        run: |
          python3 - <<'PY'
          import urllib.request,json
          urls=[
            "https://api.oltenitaimobiliare.ro/api/health",
            "https://api.oltenitaimobiliare.ro/api/oferte-externe?limit=4",
            "https://oltenitaimobiliare.ro/oferte-externe",
          ]
          for url in urls:
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"}),timeout=20) as response:
                data=response.read(150000).decode("utf-8","replace")
                print("LIVE",response.status,response.url,"bytes",len(data))
                if "/api/oferte-externe?" in url:
                  offers=json.loads(data)
                  print("LIVE_OFFERS",len(offers) if isinstance(offers,list) else "INVALID_JSON")
                  if isinstance(offers,list):
                    for offer in offers[:3]:
                      print("OFFER",offer.get("locality"),offer.get("title"),offer.get("sourceUrl"))
            except Exception as error:
              print("LIVE_ERROR",url,type(error).__name__,str(error))
          PY

name: Probe alternative property feeds
on:
  pull_request:
    paths:
      - '.github/workflows/probe-public-offers.yml'
      - 'utils/publicOfferFeed.js'
      - 'utils/publicOffersPublisher.js'
      - 'test/public-offers.test.js'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Anuntul.ro Calarasi real-estate index (read only)
        run: |
          python3 - <<'PY'
          import urllib.request,re,json
          u="https://www.anuntul.ro/anunturi-imobiliare-vanzari/toate/judetul-calarasi"
          req=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0 (compatible; OltenitaImobiliare-LinkDiscovery/1.0)"})
          try:
            with urllib.request.urlopen(req,timeout=22) as r:
              text=r.read(2_000_000).decode("utf8","replace")
              print("STATUS",r.status,"HTML_BYTES",len(text),"URL",r.url)
              print("RSS_LINKS",re.findall(r'<link[^>]+(?:application/rss\\+xml|/feed/)[^>]*>',text,re.I)[:4])
              print("JSONLD_COUNT",len(re.findall(r'application/ld\\+json',text,re.I)))
              print("ARTICLE_LINK_SAMPLES",re.findall(r'(?:href=)["\\\']([^"\\\']*/anunt/[^"\\\']+)',text,re.I)[:8])
              for term in ["59.900", "16.000", "Oltenita", "Calarasi", "data-product-id", "productData", "itemprop"]:
                i=text.find(term)
                print("TERM",term,"FOUND",i>=0,"SNIPPET",text[max(0,i-100):i+210].replace("\n"," ")[:310] if i>=0 else "")
          except Exception as e:
            print("ERROR",type(e).__name__,str(e))
            raise
          PY

name: Verify nonexcluded external references
on:
  pull_request:
    paths:
      - '.github/workflows/probe-public-offers.yml'
      - 'utils/publicOfferFeed.js'
      - 'utils/publicOffersPublisher.js'
      - 'test/public-offers.test.js'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax and exclusion tests
        run: |
          node --check utils/publicOfferFeed.js
          node --check utils/publicOffersPublisher.js
          node --check models/ExternalOffer.js
          node --check routes/publicOffersRoutes.js
          node --check server.js
          node --test test/public-offers.test.js

  inspect-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check public listing HTML structure
        run: |
          python3 - <<'PY'
          from urllib.request import urlopen,Request
          import re
          u="https://www.publi24.ro/anunturi/imobiliare/calarasi/"
          try:
            with urlopen(Request(u,headers={"User-Agent":"Mozilla/5.0"}),timeout=18) as r:
              html=r.read(1800000).decode("utf-8","replace")
              print("HTTP",r.status,"url",r.url,"len",len(html))
              print("TITLE",re.findall(r"<title[^>]*>(.*?)</title>",html,re.S|re.I)[:1])
              print("LINK SAMPLES",re.findall(r'href="([^"]{20,200})"',html,re.I)[:30])
              print("JSONLD",len(re.findall(r'application/ld\\+json',html)))
              for term in ["Casa de vanzare","Casă de vânzare","Oltenita", "Calarasi", "data-id", "data-testid", "classified-card"]:
                m=re.search(re.escape(term),html,re.I)
                print("TERM",term,"AT",m.start() if m else -1,"CONTEXT",html[max(0,m.start()-260):m.start()+350].replace("\n"," ") if m else "")
          except Exception as e:
            print("ACCESS",type(e).__name__,str(e))
          PY

  inspect-remax:
    runs-on: ubuntu-latest
    steps:
      - name: Probe REMAX public results without downloading photos
        run: |
          python3 - <<'PY'
          import urllib.request,re
          for url in [
            "https://www.remax.ro/vanzare/case/calarasi",
            "https://www.remax.ro/vanzare/apartamente/calarasi",
            "https://www.remax.ro/vanzare/terenuri/calarasi",
          ]:
            try:
              request=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(request,timeout=17) as response:
                html=response.read(1600000).decode("utf-8","replace")
                print("URL",url,"STATUS",response.status,"BYTES",len(html))
                print("REMAX LINKS",re.findall(r'href=["\\\']([^"\\\']*(?:imobiliare|proprietati|de-vanzare|/listing/|/oferta/)[^"\\\']{5,200})',html,re.I)[:12])
                for term in ["Oltenița", "Oltenita", "Fundulea", "120.000€"]:
                  pos=html.find(term)
                  print("TERM",term,"AT",pos,"HTML",html[max(0,pos-500):pos+500].replace("\n"," ") if pos>-1 else "")
            except Exception as e:
              print("URL",url,"ERROR",str(e))
          PY

name: Check public real-estate RSS availability
on:
  pull_request:
    paths:
      - '.github/workflows/probe-public-offers.yml'
      - 'utils/publicOfferFeed.js'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate parser syntax and behavior
        run: |
          node --check utils/publicOfferFeed.js
          node --check utils/publicOffersPublisher.js
          node --check models/ExternalOffer.js
          node --check routes/publicOffersRoutes.js
          node --check server.js
          node --test test/public-offers.test.js
      - name: Count real qualifying entries without database writes
        run: |
          node --input-type=module <<'JS'
          import { PUBLIC_OFFER_FEEDS,parsePropertyRss,normalizeRssOffer } from './utils/publicOfferFeed.js';
          const source=PUBLIC_OFFER_FEEDS[0];
          const response=await fetch(source.feedUrl,{headers:{'User-Agent':'OltenitaImobiliare-LinkDirectory/1.0'}});
          if(!response.ok) throw new Error('RSS HTTP '+response.status);
          const items=parsePropertyRss(await response.text());
          const eligible=items.map((o)=>normalizeRssOffer(o,source)).filter(Boolean);
          console.log('Articole RSS:',items.length,'eligibile Călărași:',eligible.length);
          for(const o of eligible.slice(0,5))console.log(o.locality,o.title,o.sourceUrl);
          JS
      - name: Probe Olteniteanul property feed (no publishing)
        run: |
          python3 - <<'PY'
          import urllib.request
          url="https://www.olteniteanul.ro/category/imobiliare-oltenita/feed/"
          req=urllib.request.Request(url,headers={"User-Agent":"OltenitaImobiliare-LinkDirectory/1.0 (contact: oltenitaimobiliare@gmail.com)"})
          try:
            with urllib.request.urlopen(req,timeout=20) as r:
              data=r.read(1_000_000)
              print("HTTP",r.status,"bytes",len(data),"items",data.count(b"<item>"))
              print("RSS",b"<rss" in data or b"<feed" in data)
          except Exception as e:
            print("Feed accessibility error:",str(e))
            raise
          PY
